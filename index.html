    <style>
      /* Splash-like background while JS boots — values match light/dark tokens */
      html { background: #f6f3ec; }
      html.dark { background: #14191b; }
      body { background: inherit; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* App-like: disable iOS rubber-band overscroll & tap highlight */
      html, body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      // Apply theme before first paint to avoid light-mode flash.
      (function () {
        try {
          var key = "app.theme";
          var legacyKey = "rasporyadok.theme";
          var raw = localStorage.getItem(key);
          if (raw !== "dark" && raw !== "light" && raw !== "system") {
            var legacy = localStorage.getItem(legacyKey);
            raw = (legacy === "dark" || legacy === "light") ? legacy : "dark"; // default = dark
          }
          var effective = raw;
          if (raw === "system") {
            effective = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
          }
          var root = document.documentElement;
          if (effective === "dark") root.classList.add("dark");
          root.setAttribute("data-theme", effective);
          root.style.colorScheme = effective;
        } catch (e) { /* ignore */ }
      })();
    </script>
